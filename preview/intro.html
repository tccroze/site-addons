<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>taro add-ons — homepage intro</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Stands in for the parts of Squarespace the intro reads: a cream page, a
       display face for the wordmark to borrow, and an article#sections wrapper
       whose first section[data-section-id] the intro inserts itself before. */
    /* The real TAN Nimbus upload, pulled from the live site so the harness
       renders the wordmark in the same face the visitor sees. Declared under
       Squarespace's own hashed family name, which is what the add-on looks
       for among the page's loaded fonts. */
    @font-face {
      font-family: 'tan---nimbus-regular-webfont-tn3woj';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('https://file.squarespace-cdn.com/content/v2/namespaces/fonts/libraries/6923f2156e59f05fd5bf40f3/assets/0c569f03-f70b-4ad7-bf09-493649495f78/font.woff2') format('woff2');
    }
    :root { --siteBackgroundColor: #f6eed5; --siteTextColor: #2b2a26; }
    body {
      margin: 0;
      background: var(--siteBackgroundColor);
      color: var(--siteTextColor);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, sans-serif;
      /* No top padding, matching the live site: Squarespace's header paints
         over the page rather than pushing it down, so article#sections really
         does start at document y=0 underneath it. */
    }
    /* Stands in for Squarespace's fixed header — the thing the intro has to pin
       below. Heights measured off the live site (163.5px desktop, 87.7px under
       768px), as is the z-index of 10 and the scroll-back behaviour below: on
       this site the header hides by translating out of view, not by collapsing,
       so its layout height never changes. */
    :root { --mock-header-h: 164px; }
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      transition: transform 140ms ease;
      height: var(--mock-header-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem;
      background: var(--siteBackgroundColor);
    }
    #header .logo { font-weight: 700; font-size: 1.6rem; letter-spacing: -0.04em; }
    #header nav { display: flex; gap: 1.4rem; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.02em; }
    #header.is-hidden { transform: translateY(calc(-1 * var(--mock-header-h))); }
    @media (max-width: 767px) { :root { --mock-header-h: 88px; } #header nav { display: none; } }
    /* The colour is the point, not decoration: Squarespace paints headings from
       --headingLargeColor with a rule on the element, which is what turned the
       wordmark red. Reproduced here so the override can be checked locally. */
    h1, h2, h3 {
      font-family: 'Times New Roman', Didot, serif;
      letter-spacing: -0.01em;
      color: hsla(8, 81%, 49%, 1);
    }
    section { padding: 8rem 2rem; max-width: 900px; margin: 0 auto; }
    /* Matches the live section: the photograph fills it, and the copy is laid
       over the top of the photograph 278px down — not stacked beneath it. */
    .photo-section { padding: 0; max-width: none; position: relative; height: 1467px; }
    .lead-photo { display: block; width: 100%; height: 100%; object-fit: cover; }
    /* z-index 1 mirrors Squarespace's .fe-block grid items, which is what was
       painting this copy over the intro's photograph. */
    .photo-section .copy { position: absolute; top: 278px; left: 58px; right: 58px; z-index: 1; }
    .photo-section .copy h2 { margin: 0 0 3.1rem; font-size: 4.6rem; line-height: 1; color: #f6eee0; }
    .swatch { height: 300px; background: rgba(43,42,38,0.07); border-radius: 3px; }
  </style>
</head>
<body>
  <header id="header">
    <div class="logo">tc</div>
    <nav><span>VENUES</span><span>STILLS</span><span>MOTION</span><span>PAINT</span><span>ABOUT</span><span>LET'S TALK</span><span>SHOP</span></nav>
  </header>

  <article id="sections">
    <!-- Mirrors the live section below the intro: a full-bleed photograph with
         the two lines of copy beneath it. The tear is meant to lie over the top
         of that photograph, so the harness needs a real one to check against. -->
    <section data-section-id="mock-1" class="photo-section">
      <img class="lead-photo"
           src="https://images.squarespace-cdn.com/content/v1/6923f2156e59f05fd5bf40f3/def6fd2f-3d9e-4d44-b660-e8e11f0708cc/P1022968.jpg?format=2500w"
           alt="">
      <div class="copy">
        <h2>Art that feels loved.</h2>
        <h2>visuals that feel lived.</h2>
      </div>
    </section>
    <section data-section-id="mock-2">
      <h2>Third section</h2>
      <div class="swatch"></div>
    </section>
  </article>

  <script>
    // ?scroll=N jumps to that offset once everything has settled, so a headless
    // screenshot can catch the intro mid-sink rather than only at rest. Read it
    // before the rewrite below, which drops the query string.
    var params = new URLSearchParams(location.search);
    var jump = Number(params.get('scroll')) || 0;
    var debug = params.has('debug');

    // Squarespace's "scroll back" header: hides on the way down, returns on the
    // way up. The intro pins to its visible edge, so this has to be here or the
    // preview can't show what that actually looks like.
    addEventListener('DOMContentLoaded', function () {
      var el = document.getElementById('header');
      var prev = window.scrollY;
      addEventListener('scroll', function () {
        var y = window.scrollY;
        el.classList.toggle('is-hidden', y > prev && y > el.offsetHeight);
        prev = y;
      }, { passive: true });
    });

    // The intro only runs on the homepage. Same origin, so this is enough to
    // make the harness look like '/' without touching the add-on.
    history.replaceState(null, '', '/');

    // Both hooks hang off the intro mounting, and both run synchronously in the
    // observer: `--dump-dom` snapshots before load, so anything deferred to a
    // scroll or load handler is too late to be captured.
    if (jump || debug) new MutationObserver(function (_, obs) {
      if (!document.querySelector('.taro-intro')) return;
      obs.disconnect();
      if (jump) window.scrollTo(0, jump);
      if (debug) dump();
    }).observe(document.documentElement, { childList: true, subtree: true });

    // ?debug=1 mirrors the live geometry into the page title, which is the one
    // channel a headless `--dump-dom` run can read back without a debugger
    // attached. Refreshed on scroll so whenever the dump lands it is current.
    if (debug) {
      var box = function (sel) {
        var el = document.querySelector(sel);
        if (!el) return null;
        var b = el.getBoundingClientRect();
        return [Math.round(b.top), Math.round(b.height)];
      };
      // Painted into the page rather than the title: a headless screenshot is
      // taken at load, which is late enough to see the mounted intro, whereas
      // --dump-dom snapshots before the add-ons have finished running.
      var panel = document.createElement('pre');
      panel.style.cssText = 'position:fixed;z-index:99999;left:0;top:0;margin:0;'
        + 'padding:6px 10px;background:#111;color:#0f0;font:11px/1.45 monospace;'
        + 'white-space:pre-wrap;max-width:52ch';
      addEventListener('DOMContentLoaded', function () { document.body.appendChild(panel); });

      var dump = function () {
        panel.textContent = JSON.stringify({
          scrollY: Math.round(window.scrollY),
          docH: document.documentElement.scrollHeight,
          wrap: box('.taro-intro'),
          stage: box('.taro-intro__stage'),
          frame: box('.taro-intro__frame'),
          stagePosition: getComputedStyle(document.querySelector('.taro-intro__stage')).position,
          aboveIntro: [].slice.call(document.querySelectorAll('article#sections > *'))
            .slice(0, 3).map(function (e) { return e.tagName + '.' + (e.className || '-'); }),
          bodyKids: [].slice.call(document.body.children)
            .map(function (e) { return e.tagName + '.' + (e.className || '-'); }),
        }, null, 1);
      };
      addEventListener('scroll', dump, { passive: true });
      addEventListener('load', dump);
    }
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
